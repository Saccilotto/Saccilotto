name: Metrics

on:
  # Daily refresh at 06:00 UTC (03:00 BRT)
  schedule:
    - cron: "0 6 * * *"
  # Manual trigger
  workflow_dispatch:
  # Re-run when the workflow itself changes
  push:
    branches: ["main"]
    paths: [".github/workflows/metrics.yml"]

permissions:
  contents: write

# Serialize workflow runs so parallel jobs don't fight over commits
concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  overview:
    name: Overview card
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Saccilotto
          filename: metrics.svg
          template: classic
          base: header, activity, community, repositories
          config_timezone: America/Sao_Paulo
          config_order: base.header, base.activity, base.community, base.repositories, lines, followup, topics
          plugin_lines: yes
          plugin_followup: yes
          plugin_followup_sections: repositories, user
          plugin_topics: yes
          plugin_topics_limit: 15
          plugin_topics_mode: icons
          plugin_topics_sort: stars

  isocalendar:
    name: Isocalendar
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Saccilotto
          filename: metrics.isocalendar.svg
          base: ""
          config_timezone: America/Sao_Paulo
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

  languages:
    name: Languages
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Saccilotto
          filename: metrics.languages.svg
          base: ""
          config_timezone: America/Sao_Paulo
          plugin_languages: yes
          plugin_languages_ignored: html, css, scss, sass, tex, jupyter-notebook, makefile
          plugin_languages_details: percentage, bytes-size
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_limit: 8
          plugin_languages_sections: most-used, recently-used
          plugin_languages_recent_categories: programming, markup
